name: Build mod
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: unzip -q '*.zip'
      - run: chmod +x gradlew
        working-directory: EdgeCombatToggle
      - run: sed -i '/toolchain/d' build.gradle
        working-directory: EdgeCombatToggle
      - run: ./gradlew build
        working-directory: EdgeCombatToggle
      - uses: actions/upload-artifact@v4
        with:
          name: edge-combat-toggle-jar
          path: EdgeCombatToggle/build/libs/*.jar
